[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ribosome-state-annotator"
version = "0.1.0.dev0"
description = "Annotate functional states of complete bacterial and eukaryotic ribosome assemblies from PDB entries."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
authors = [
    { name = "Sri Devan Appasamy" },
]
keywords = ["ribosome", "structural-biology", "pdb", "rcsb", "bgsu", "gemmi", "annotation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "gemmi>=0.6",
    "httpx>=0.27",
    "pydantic>=2.6",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
pandas = ["pandas>=2.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
ribostate = "ribosome_state_annotator.cli:app"

[project.urls]
Repository = "https://github.com/srideva/ribosome-functional-annotation"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Default run excludes `network`-marked tests (live RCSB / BGSU calls).
# Run them with: pytest -m network
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not network",
]
markers = [
    "network: integration tests that hit the live RCSB / BGSU APIs (excluded by default)",
]
filterwarnings = [
    "error",
    # Pydantic v2 occasionally emits deprecation warnings from upstream deps; relax later if needed.
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # asserts in tests

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = "src"
packages = ["ribosome_state_annotator"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "gemmi"
ignore_missing_imports = true
